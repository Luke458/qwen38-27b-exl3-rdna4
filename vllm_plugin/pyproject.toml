[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exl3rocm"
version = "0.1.0"
description = "vLLM out-of-tree quantization plugin: EXL3 (trellis-quantized) weights on ROCm gfx1201"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.entry-points."vllm.general_plugins"]
exl3rocm = "exl3rocm.plugin:register"

[tool.setuptools]
packages = ["exl3rocm"]
